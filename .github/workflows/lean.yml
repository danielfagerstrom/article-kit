name: Lean CI (reusable)

# Cloud verification backstop for an article's Lean formalisation. Interactive proving stays
# local; this re-verifies the proofs on every push and pull request, so verification does not
# depend on the author's desktop.
#
# Three guards, in order of what they protect:
#   1. the build itself (leanprover/lean-action, with `lake exe cache get` for Mathlib)
#   2. no `sorry` in the library sources
#   3. the trust boundary — `#print axioms` on the headline theorems must reduce to Lean core
#      plus the article's declared analytic interfaces and nothing else
#
# Guard 3's allowlist used to be duplicated inline here. It now comes from the article's
# `blueprint/trust-boundary.txt` via `linkage axioms`, which additionally refuses any name
# that no AXIOMS.md entry mentions — so the boundary cannot be widened without a reviewed
# ledger entry behind it. See linkage/trust.py for why it is not derived from the ledger.
#
# ── Why this workflow drives the Lake cache itself ────────────────────────────────────────
# `lean-action` has its own `use-github-cache`, which caches the WHOLE `<lean_dir>/.lake` —
# Mathlib's compiled oleans included. That is a duplicate of what `lake exe cache get` pulls
# from Mathlib's own cloud cache on the very next step, and it is most of the payload: the
# entry grew to 2.3 GB compressed / ~8 GB unpacked. Restoring it, then re-downloading all of
# Mathlib's `.ltar` bundles on top of it, then building, filled the runner's disk. The
# post-build `actions/cache/save` then had no room to write `cache.tzst` and reported
#
#     zstd: error 70 : Write error : cannot write block : No space left on device
#     ##[warning]Failed to save: "/usr/bin/tar" failed with error: ... exit code 2
#
# A cache-save failure is only a WARNING, so every run stayed green while silently never
# refreshing the cache — the whole repo sat on one Aug-23 snapshot for ten days, rebuilding
# more drift each time, until the runner died mid-build with no logs at all.
#
# So: `use-github-cache: false`, and the restore/save below cache `.lake` MINUS Mathlib's
# build tree. Excluding it costs nothing — `lake exe cache get` downloads those oleans on
# every run regardless, because its `.ltar` bundles live in `~/.cache/mathlib`, which was
# never cached. Everything else (the package checkouts, this article's own build, a private
# core library's build) is kept, because nothing else re-fetches it.

on:
  workflow_call:
    inputs:
      lean_dir:
        description: "Directory holding the lakefile."
        required: false
        default: Formalization
        type: string
      build_args:
        description: "Lake target(s) to build, e.g. the library name. Empty builds the default."
        required: false
        default: ""
        type: string
      sorry_guard_dir:
        description: >-
          Directory scanned for `sorry`. Usually the library subtree, so that scratch /
          guard files at the package root are not scanned.
        required: false
        default: ""
        type: string
      axiom_guard_file:
        description: "Lean file whose `#print axioms` output is checked. Empty skips guard 3."
        required: false
        default: CIAxiomGuard.lean
        type: string
      build_jobs:
        description: >-
          Value for `lake build -j`, capping how many Lean workers run at once. Empty uses
          Lake's default (one per core). Peak memory is roughly this many workers' worth, so
          set it to 2 if a build ever dies mid-step on a runner with little RAM. Note that
          the failure this workflow was fixed for looked like an OOM but was disk, not
          memory — try `free_disk` before reaching for this.
        required: false
        default: ""
        type: string
      free_disk:
        description: >-
          Delete the preinstalled toolchains a Lean build never uses (Android SDK, .NET,
          GHC, CodeQL, Swift, PowerShell, Docker images) before building. Reclaims ~20 GB on
          ubuntu-latest, which a Mathlib-downstream build genuinely needs: the restored
          cache, Mathlib's downloaded `.ltar` bundles, its unpacked oleans and the new cache
          archive do not otherwise fit together on one runner.
        required: false
        default: true
        type: boolean
      linkage_ref:
        description: "Ref of the linkage framework to install."
        required: false
        default: main
        type: string
      private_dep_owner:
        description: >-
          GitHub owner whose repos may be private Lake dependencies. Git is told to
          authenticate clones under this owner only — never all of github.com, which would
          send the token to public dependencies a fine-grained PAT cannot cover.
        required: false
        default: danielfagerstrom
        type: string

    secrets:
      ARTICLE_KIT_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Not a micro-optimisation: without this the job runs out of disk, and running out of
      # disk is how the cache save silently fails and how the runner dies mid-build with no
      # logs uploaded. `|| true` throughout — a path missing from a future runner image must
      # never turn CI red. /opt/hostedtoolcache is pruned surgically: Python lives there and
      # the linkage install below needs it.
      - name: Reclaim runner disk space
        if: inputs.free_disk
        run: |
          echo "before:"; df -h /
          for d in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift; do
            sudo rm -rf "$d" || true
          done
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "after:"; df -h /

      # A Lake `require ... git` on a PRIVATE repo (e.g. a shared core library) is fetched by
      # lake itself, not by actions/checkout, so it needs ambient git credentials. Same token
      # as the framework install — which therefore needs Contents:read on every private repo
      # this article depends on, not just article-kit.
      # No `if:` on this step. A step's own `env:` is NOT in scope for its own `if:`, so
      # `if: env.KIT_TOKEN != ''` is always false and the step silently never runs — which is
      # exactly how the first real run failed, with lake reporting a bare `error: 403`.
      # The guard lives in the script instead, where the variable actually exists.
      - name: Authenticate git for private Lake dependencies
        env:
          KIT_TOKEN: ${{ secrets.ARTICLE_KIT_TOKEN }}
        run: |
          if [ -z "$KIT_TOKEN" ]; then
            echo "no ARTICLE_KIT_TOKEN — assuming all Lake dependencies are public"
            exit 0
          fi
          # Scope the rewrite to the OWNER, never all of github.com. A blanket rewrite sends
          # the token to every clone including public dependencies (Mathlib, batteries,
          # aesop...), and a fine-grained PAT that does not cover them answers 403 —
          # "Write access to repository not granted" on a public repo it has no grant for.
          git config --global             url."https://x-access-token:${KIT_TOKEN}@github.com/${{ inputs.private_dep_owner }}/".insteadOf             "https://github.com/${{ inputs.private_dep_owner }}/"
          echo "git will authenticate clones under ${{ inputs.private_dep_owner }}/ only"

      # Same key scheme lean-action uses — toolchain + manifest + commit, with a prefix
      # restore-key so a run inherits the nearest previous build. The `v2` marks the payload
      # change: the entry no longer contains Mathlib's build tree, so it is a different
      # cache from the pre-fix ones (`actions/cache` versions entries by their path list
      # anyway; the tag just makes the two distinguishable in the Caches UI).
      #
      # Restore and save are separate actions, deliberately: a prefix restore-key match is
      # NOT an exact-key hit, so the single `actions/cache` action would still save — but
      # the split makes the save unconditional and its `if:` visible here rather than
      # buried in a composite action's internals.
      - name: Restore the Lake build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ inputs.lean_dir }}/.lake
            !${{ inputs.lean_dir }}/.lake/packages/mathlib/.lake/build
          key: lake-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/lean-toolchain', inputs.lean_dir)) }}-${{ hashFiles(format('{0}/lake-manifest.json', inputs.lean_dir)) }}-${{ github.sha }}
          restore-keys: lake-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/lean-toolchain', inputs.lean_dir)) }}-${{ hashFiles(format('{0}/lake-manifest.json', inputs.lean_dir)) }}-

      # elan/lean/lake setup + `lake exe cache get` (auto, Mathlib detected) + `lake build`.
      # A lakefile whose lean_lib uses `globs = ["Lib.*"]` compiles *every* module under the
      # library, so a broken proof in a module reachable only from a scratch file still turns
      # CI red — without the glob, only the root import closure is built.
      # `use-github-cache: false` because this workflow does the caching itself; see the
      # header. Leaving it on would restore a second, Mathlib-inclusive copy of `.lake`.
      - name: Build the Lean library
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: ${{ inputs.lean_dir }}
          build-args: ${{ inputs.build_jobs != '' && format('-j {0} {1}', inputs.build_jobs, inputs.build_args) || inputs.build_args }}
          use-github-cache: "false"

      # The save that follows is the one that used to fail silently. Two things protect it:
      # the `.ltar` bundles are scratch once unpacked and are several GB, so they go; and if
      # the disk is still too tight to write the archive we fail loudly here instead of
      # letting `actions/cache/save` downgrade it to a warning nobody reads. A green build
      # that cannot record its result is not a green run — the next one pays for it.
      - name: Trim scratch and check there is room to save the cache
        run: |
          rm -rf ~/.cache/mathlib
          echo "whole .lake / of which Mathlib's build tree (the part NOT cached):"
          du -sh "${{ inputs.lean_dir }}/.lake" 2>/dev/null || true
          du -sh "${{ inputs.lean_dir }}/.lake/packages/mathlib/.lake/build" 2>/dev/null || true
          df -h /
          free_mb=$(( $(df --output=avail -k / | tail -1) / 1024 ))
          if [ "$free_mb" -lt 3072 ]; then
            echo "::error::only ${free_mb} MB of disk left — the Lake cache save would fail with 'No space left on device' and be reported as a mere warning. Set free_disk: true, or trim what the build writes."
            exit 1
          fi
          echo "OK: ${free_mb} MB free, enough to write the cache archive."

      - name: Save the Lake build cache
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ inputs.lean_dir }}/.lake
            !${{ inputs.lean_dir }}/.lake/packages/mathlib/.lake/build
          key: lake-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/lean-toolchain', inputs.lean_dir)) }}-${{ hashFiles(format('{0}/lake-manifest.json', inputs.lean_dir)) }}-${{ github.sha }}

      # The pattern excludes the backtick-wrapped prose `sorry`(-free) that legitimately
      # appears in docstrings, while still catching a real `sorry` term/tactic (always
      # adjacent to whitespace/parens, never a backtick).
      - name: Guard — no `sorry` in the Lean sources
        env:
          SCAN_DIR: ${{ inputs.sorry_guard_dir != '' && inputs.sorry_guard_dir || inputs.lean_dir }}
        run: |
          if grep -rnE '(^|[^`[:alnum:]_])sorry([^`[:alnum:]_-]|$)' --include='*.lean' "$SCAN_DIR"; then
            echo "::error::A 'sorry' appears in $SCAN_DIR — the development must stay sorry-free."
            exit 1
          fi
          echo "OK: no 'sorry' in $SCAN_DIR."

      # article-kit may be private, in which case the runner's GITHUB_TOKEN cannot read it
      # (allowing reusable-workflow *calls* is a separate permission from repo read). A
      # fine-grained PAT with Contents:read on article-kit, passed as ARTICLE_KIT_TOKEN,
      # covers that; without one this falls back to an anonymous clone, which is what a
      # public article-kit needs.
      #
      # Clone to $RUNNER_TEMP, never into the workspace: the manifest emitter's
      # `source_dirty` flag is a whole-repo `git status --porcelain`, so an untracked
      # directory inside the article tree would falsely stamp the projection dirty.
      - name: Install the linkage framework
        if: inputs.axiom_guard_file != ''
        env:
          KIT_TOKEN: ${{ secrets.ARTICLE_KIT_TOKEN }}
        run: |
          kit="$RUNNER_TEMP/article-kit"
          if [ -n "$KIT_TOKEN" ]; then
            auth="https://x-access-token:${KIT_TOKEN}@github.com/danielfagerstrom/article-kit"
          else
            auth="https://github.com/danielfagerstrom/article-kit"
          fi
          if ! git clone --depth 1 --branch "${{ inputs.linkage_ref }}" "$auth" "$kit" 2>/dev/null; then
            echo "::error::could not clone danielfagerstrom/article-kit@${{ inputs.linkage_ref }}. If it is private, add a fine-grained PAT with Contents:read on article-kit as the ARTICLE_KIT_TOKEN secret on this repo and pass it through in the caller workflow."
            exit 1
          fi
          pipx install "$kit"
          linkage --help > /dev/null
          echo "linkage installed from article-kit@${{ inputs.linkage_ref }}"

      # The allowlist is the article's declared trust boundary, and `--check` fails when any
      # declared name is not mentioned by a ledger entry — a name added to CI without review
      # is caught here rather than living quietly in a YAML heredoc.
      - name: Guard — trust boundary (`#print axioms`)
        if: inputs.axiom_guard_file != ''
        env:
          GUARD_FILE: ${{ inputs.axiom_guard_file }}
        run: |
          set -o pipefail
          allow_file="$RUNNER_TEMP/allowed-axioms.txt"
          linkage axioms --check > "$allow_file"
          echo "allowed axioms ($(wc -l < "$allow_file")):"; sed 's/^/  /' "$allow_file"

          cd "${{ inputs.lean_dir }}"
          out="$(lake env lean "$GUARD_FILE" 2>&1)" || {
            echo "$out"
            echo "::error::$GUARD_FILE failed to elaborate."
            exit 1
          }
          echo "$out"

          # (a) no sorry in the trust base — robust regardless of pretty-printer wording.
          if grep -q 'sorryAx' <<<"$out"; then
            echo "::error::sorryAx reached a headline theorem — a sorry is in the trust base."
            exit 1
          fi

          # (b) no axiom outside the declared boundary. Collect every axiom named in the
          # `#print axioms` output (join wrapped lines first). `|| true` on the grep: an
          # all-axiom-free run yields no match, which must not fail the step.
          joined="$(printf '%s' "$out" | tr '\n' ' ')"
          lists="$(grep -oE 'depends on axioms: \[[^]]*\]' <<<"$joined" || true)"
          found="$(printf '%s' "$lists" \
            | sed -E 's/depends on axioms: \[//; s/\]//' \
            | tr ',' '\n' \
            | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' \
            | sort -u)"

          bad=""
          while IFS= read -r a; do
            [ -z "$a" ] && continue
            grep -qxF "$a" "$allow_file" || bad="$bad $a"
          done <<<"$found"

          if [ -n "$bad" ]; then
            echo "::error::headline theorems depend on axioms outside the declared trust boundary:$bad"
            exit 1
          fi
          echo "OK: trust base reduces to Lean core + the declared analytic interfaces only."
