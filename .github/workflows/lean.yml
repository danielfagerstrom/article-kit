name: Lean CI (reusable)

# Cloud verification backstop for an article's Lean formalisation. Interactive proving stays
# local; this re-verifies the proofs on every push and pull request, so verification does not
# depend on the author's desktop.
#
# Three guards, in order of what they protect:
#   1. the build itself (leanprover/lean-action, with `lake exe cache get` for Mathlib)
#   2. no `sorry` in the library sources
#   3. the trust boundary — `#print axioms` on the headline theorems must reduce to Lean core
#      plus the article's declared analytic interfaces and nothing else
#
# Guard 3's allowlist used to be duplicated inline here. It now comes from the article's
# `blueprint/trust-boundary.txt` via `linkage axioms`, which additionally refuses any name
# that no AXIOMS.md entry mentions — so the boundary cannot be widened without a reviewed
# ledger entry behind it. See linkage/trust.py for why it is not derived from the ledger.

on:
  workflow_call:
    inputs:
      lean_dir:
        description: "Directory holding the lakefile."
        required: false
        default: Formalization
        type: string
      build_args:
        description: "Lake target(s) to build, e.g. the library name. Empty builds the default."
        required: false
        default: ""
        type: string
      sorry_guard_dir:
        description: >-
          Directory scanned for `sorry`. Usually the library subtree, so that scratch /
          guard files at the package root are not scanned.
        required: false
        default: ""
        type: string
      axiom_guard_file:
        description: "Lean file whose `#print axioms` output is checked. Empty skips guard 3."
        required: false
        default: CIAxiomGuard.lean
        type: string
      linkage_ref:
        description: "Ref of the linkage framework to install."
        required: false
        default: main
        type: string

    secrets:
      ARTICLE_KIT_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # elan/lean/lake setup + `lake exe cache get` (auto, Mathlib detected) + `lake build`.
      # A lakefile whose lean_lib uses `globs = ["Lib.*"]` compiles *every* module under the
      # library, so a broken proof in a module reachable only from a scratch file still turns
      # CI red — without the glob, only the root import closure is built.
      - name: Build the Lean library
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: ${{ inputs.lean_dir }}
          build-args: ${{ inputs.build_args }}

      # The pattern excludes the backtick-wrapped prose `sorry`(-free) that legitimately
      # appears in docstrings, while still catching a real `sorry` term/tactic (always
      # adjacent to whitespace/parens, never a backtick).
      - name: Guard — no `sorry` in the Lean sources
        env:
          SCAN_DIR: ${{ inputs.sorry_guard_dir != '' && inputs.sorry_guard_dir || inputs.lean_dir }}
        run: |
          if grep -rnE '(^|[^`[:alnum:]_])sorry([^`[:alnum:]_-]|$)' --include='*.lean' "$SCAN_DIR"; then
            echo "::error::A 'sorry' appears in $SCAN_DIR — the development must stay sorry-free."
            exit 1
          fi
          echo "OK: no 'sorry' in $SCAN_DIR."

      # article-kit may be private, in which case the runner's GITHUB_TOKEN cannot read it
      # (allowing reusable-workflow *calls* is a separate permission from repo read). A
      # fine-grained PAT with Contents:read on article-kit, passed as ARTICLE_KIT_TOKEN,
      # covers that; without one this falls back to an anonymous clone, which is what a
      # public article-kit needs.
      #
      # Clone to $RUNNER_TEMP, never into the workspace: the manifest emitter's
      # `source_dirty` flag is a whole-repo `git status --porcelain`, so an untracked
      # directory inside the article tree would falsely stamp the projection dirty.
      - name: Install the linkage framework
        if: inputs.axiom_guard_file != ''
        env:
          KIT_TOKEN: ${{ secrets.ARTICLE_KIT_TOKEN }}
        run: |
          kit="$RUNNER_TEMP/article-kit"
          if [ -n "$KIT_TOKEN" ]; then
            auth="https://x-access-token:${KIT_TOKEN}@github.com/danielfagerstrom/article-kit"
          else
            auth="https://github.com/danielfagerstrom/article-kit"
          fi
          if ! git clone --depth 1 --branch "${{ inputs.linkage_ref }}" "$auth" "$kit" 2>/dev/null; then
            echo "::error::could not clone danielfagerstrom/article-kit@${{ inputs.linkage_ref }}. If it is private, add a fine-grained PAT with Contents:read on article-kit as the ARTICLE_KIT_TOKEN secret on this repo and pass it through in the caller workflow."
            exit 1
          fi
          pipx install "$kit"
          linkage --help > /dev/null
          echo "linkage installed from article-kit@${{ inputs.linkage_ref }}"

      # The allowlist is the article's declared trust boundary, and `--check` fails when any
      # declared name is not mentioned by a ledger entry — a name added to CI without review
      # is caught here rather than living quietly in a YAML heredoc.
      - name: Guard — trust boundary (`#print axioms`)
        if: inputs.axiom_guard_file != ''
        env:
          GUARD_FILE: ${{ inputs.axiom_guard_file }}
        run: |
          set -o pipefail
          allow_file="$RUNNER_TEMP/allowed-axioms.txt"
          linkage axioms --check > "$allow_file"
          echo "allowed axioms ($(wc -l < "$allow_file")):"; sed 's/^/  /' "$allow_file"

          cd "${{ inputs.lean_dir }}"
          out="$(lake env lean "$GUARD_FILE" 2>&1)" || {
            echo "$out"
            echo "::error::$GUARD_FILE failed to elaborate."
            exit 1
          }
          echo "$out"

          # (a) no sorry in the trust base — robust regardless of pretty-printer wording.
          if grep -q 'sorryAx' <<<"$out"; then
            echo "::error::sorryAx reached a headline theorem — a sorry is in the trust base."
            exit 1
          fi

          # (b) no axiom outside the declared boundary. Collect every axiom named in the
          # `#print axioms` output (join wrapped lines first). `|| true` on the grep: an
          # all-axiom-free run yields no match, which must not fail the step.
          joined="$(printf '%s' "$out" | tr '\n' ' ')"
          lists="$(grep -oE 'depends on axioms: \[[^]]*\]' <<<"$joined" || true)"
          found="$(printf '%s' "$lists" \
            | sed -E 's/depends on axioms: \[//; s/\]//' \
            | tr ',' '\n' \
            | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' \
            | sort -u)"

          bad=""
          while IFS= read -r a; do
            [ -z "$a" ] && continue
            grep -qxF "$a" "$allow_file" || bad="$bad $a"
          done <<<"$found"

          if [ -n "$bad" ]; then
            echo "::error::headline theorems depend on axioms outside the declared trust boundary:$bad"
            exit 1
          fi
          echo "OK: trust base reduces to Lean core + the declared analytic interfaces only."
