name: Docs CI (reusable)

# Cloud builds of an article's two PDF deliverables — the paper and the blueprint — so a
# readable, current build exists without the author's desktop MiKTeX. On pushes to `main`
# the built PDFs are force-pushed to the orphan `artifacts` branch as a single fresh commit
# (no accumulated history); GitHub renders PDFs inline in a private repo, so
#   https://github.com/<owner>/<repo>/blob/artifacts/paper.pdf
#   https://github.com/<owner>/<repo>/blob/artifacts/blueprint.pdf
# are the private viewing URLs until a gated web channel exists.
#
# Toolchain: Tectonic — a single static binary that fetches the TeX packages it needs on
# demand and runs bibtex automatically (classic bibtex, not biber). Both documents are
# expected to use a tame package set (geometry / ams* / longtable / booktabs / hyperref;
# print.tex is plain LaTeX with the leanblueprint macros stubbed as no-ops in
# linkage-macros.tex), well inside Tectonic's default bundle.
#
# The CALLER owns the trigger and its paths filter — that is what guards private-repo
# Actions minutes, and it is article-specific. The paper build should run on paper AND
# blueprint changes: theorem statements are single-sourced between the two, so a blueprint
# edit must rebuild the paper.
#
# The `web` job builds the THIRD view: the plasTeX blueprint under blueprint/web/, which is
# the only one that renders the \uses dependency graph and the [T]/[A] status tags. It is
# deployed alongside the PDFs at /blueprint/, so the graph is a shareable URL rather than a
# local artifact.
#
# Its two system dependencies are exactly the ones that are easy to get wrong, because a
# desktop with MiKTeX and Graphviz installed hides both, and neither failure is loud:
#
#   - GRAPHVIZ IS NEEDED AT BUILD TIME. plastexdepgraph pulls in pygraphviz, which is a
#     binding against the Graphviz C library; the wasm the plugin also ships
#     (graphvizlib.wasm via d3-graphviz) only lays the graph out in the reader's browser.
#     Without the system package pygraphviz still installs from a wheel and the build still
#     succeeds — it just emits a graph with no nodes. Hence the apt step and the node count
#     in the validation.
#   - KPSEWHICH IS NEEDED, THOUGH NO TeX FORMATS ARE. Nothing here is typeset -- all
#     mathematics goes to MathJax, so plasTeX emits no images and the job passes
#     --imager=none to say so rather than rely on a fallback probe. But plasTeX resolves
#     every \input through kpsewhich, and its fallback is an exact filename match against
#     a directory listing, which cannot resolve any path containing a separator. Without
#     it, blueprint/src/parts/* is dropped and the site renders complete but empty.
#
# The web build is NOT force-pushed to the `artifacts` branch — that branch is for the PDFs;
# a couple of megabytes of HTML and wasm rewritten on every build does not belong in git.
#
# The `deploy` job publishes the set to the ONE research site, into this module's own channel
# in its content bucket (hub ADR-0016). It replaced a Cloudflare Pages project per article on
# 2026-09-18: a Pages deploy is atomic over a whole project, so several repositories could
# never share one site, and each new article meant another pages.dev hostname plus an Access
# application that had to be remembered by hand — a gate that failed OPEN when it was not.
#
# Now the repository publishes bytes under its slug and says nothing about who may read them.
# The trigger picks the channel (`main` on a branch, the tag on a tag), and the hub's manifest
# decides which channels the site serves where. So an article cannot publish itself by
# accident, and an unreleased module has no public URL at all.
#
# On pull requests pass dry_run: true — assemble dist/ and validate it, never publish.
# Otherwise it FAILS LOUDLY if the R2 secrets are missing (the build and publish jobs stay
# green).

on:
  workflow_call:
    inputs:
      slug:
        description: >-
          This module's reader-facing slug on the research site, e.g.
          'hemigroup-spatial-kernels-line'. It is the module's `site.slug` in the hub's
          constellation.json — NOT its member slug — and it is a permanent public URL.
          Content is published to <slug>/<channel>/ in the site's content bucket.
        required: true
        type: string
      bucket:
        description: "The research site's content bucket (hub ADR-0016)."
        required: false
        default: research-content
        type: string
      dry_run:
        description: "Assemble and validate dist/, but never deploy or push the artifacts branch."
        required: false
        default: false
        type: boolean
      build_blueprint:
        description: "Build the blueprint PDF. Callers may skip it on paper-only pull requests."
        required: false
        default: true
        type: boolean
      paper_tex:
        description: "Entry point of the paper."
        required: false
        default: paper/main.tex
        type: string
      blueprint_tex:
        description: "Entry point of the blueprint's print build."
        required: false
        default: blueprint/src/print.tex
        type: string
      extra_papers:
        description: >-
          Further papers of the same repository, as a JSON list of objects
          {"name": ..., "tex": ..., "title": ...}: each is built like the paper, published to the
          artifacts branch and listed on the site as <name>.pdf. For an article whose repository
          holds several modules (Paper V's ADR-0004/0006: a released line paper in paper/ and
          modules B and C in paper-b/, paper-c/). Empty list: nothing extra.
        required: false
        default: "[]"
        type: string
      build_web:
        description: >-
          Build and deploy the plasTeX web blueprint (the dependency-graph view). Requires
          blueprint/src/web.tex and blueprint/src/plastex.cfg, both part of the scaffold.
        required: false
        default: true
        type: boolean
      blueprint_web_dir:
        description: "Directory holding plastex.cfg and web.tex; plastex runs from here."
        required: false
        default: blueprint/src
        type: string
      blueprint_web_out:
        description: >-
          Where plastex.cfg's [files] directory= resolves to, relative to the repo root.
          Must agree with that setting or the upload finds nothing.
        required: false
        default: blueprint/web
        type: string
      plastex_requirements:
        description: >-
          pip requirements for the web build, pinned for reproducibility. Keep plasTeX in
          lockstep with what authors run locally, so CI and the desk render the same bytes.
        required: false
        default: "plastex==3.1 plastexdepgraph==0.0.5 plastexshowmore==0.0.2 leanblueprint==0.0.20"
        type: string
      tectonic_version:
        description: >-
          Pinned Tectonic. Keep in lockstep with the version .claude/cloud-setup.sh installs,
          so a cloud session and CI build the same bytes.
        required: false
        default: "0.15.0"
        type: string
    secrets:
      # An R2 *account* API token scoped to the bucket, object read & write. Account rather
      # than user: a user token's effective permissions are the intersection of its scope and
      # that person's membership, so it stops working for reasons unrelated to CI.
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

# NOTE: no workflow-level `env:` here. The `inputs` context is not available at that
# scope in a called workflow — using it there makes the whole run fail with a bare
# "workflow file issue" startup_failure and no step logs. Job-level env is fine.

jobs:
  paper:
    runs-on: ubuntu-latest
    env:
      TECTONIC_VERSION: ${{ inputs.tectonic_version }}
      PAPER_TEX: ${{ inputs.paper_tex }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tectonic caches every package it fetches under ~/.cache/Tectonic; restoring it
      # turns the network fetches into no-ops. Keyed on the TeX sources so the cache is
      # re-saved when a new package enters the preamble.
      - name: Cache the Tectonic package bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-${{ hashFiles('paper/**/*.tex', 'paper/references.bib') }}
          restore-keys: |
            tectonic-${{ runner.os }}-

      - name: Install Tectonic
        run: |
          curl -fsSL -o tectonic.tar.gz \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf tectonic.tar.gz tectonic
          sudo mv tectonic /usr/local/bin/

      # Tectonic reruns TeX/bibtex to a fixed point on its own — no latexmk needed.
      # Output lands next to the input; rename to the canonical name here so the publish
      # job never has to know the article's entry-point filenames.
      - name: Build the paper
        run: |
          tectonic "$PAPER_TEX"
          cp "${PAPER_TEX%.tex}.pdf" paper.pdf

      - name: Upload paper.pdf (per-run artifact)
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper.pdf
          if-no-files-found: error

  # The further papers of a multi-module repository, one matrix leg each; the same steps as
  # `paper`, the output named <name>.pdf so that publish and deploy pick every leg up through
  # the `*-pdf` artifact pattern without knowing the entry points.
  extra_paper:
    if: inputs.extra_papers != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper: ${{ fromJSON(inputs.extra_papers) }}
    env:
      TECTONIC_VERSION: ${{ inputs.tectonic_version }}
      PAPER_TEX: ${{ matrix.paper.tex }}
      PAPER_NAME: ${{ matrix.paper.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache the Tectonic package bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-${{ hashFiles('paper*/**/*.tex') }}
          restore-keys: |
            tectonic-${{ runner.os }}-

      - name: Install Tectonic
        run: |
          curl -fsSL -o tectonic.tar.gz \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf tectonic.tar.gz tectonic
          sudo mv tectonic /usr/local/bin/

      - name: Build ${{ matrix.paper.name }}
        run: |
          tectonic "$PAPER_TEX"
          cp "${PAPER_TEX%.tex}.pdf" "${PAPER_NAME}.pdf"

      - name: Upload ${{ matrix.paper.name }}.pdf (per-run artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.paper.name }}-pdf
          path: ${{ matrix.paper.name }}.pdf
          if-no-files-found: error

  blueprint:
    if: inputs.build_blueprint
    runs-on: ubuntu-latest
    env:
      TECTONIC_VERSION: ${{ inputs.tectonic_version }}
      BLUEPRINT_TEX: ${{ inputs.blueprint_tex }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache the Tectonic package bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-${{ hashFiles('blueprint/src/**/*.tex') }}
          restore-keys: |
            tectonic-${{ runner.os }}-

      - name: Install Tectonic
        run: |
          curl -fsSL -o tectonic.tar.gz \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf tectonic.tar.gz tectonic
          sudo mv tectonic /usr/local/bin/

      # print.tex is the standalone (non-leanblueprint) driver: plain LaTeX, \input of
      # macros.tex + content.tex, no graphviz/dot step.
      - name: Build the blueprint
        run: |
          tectonic "$BLUEPRINT_TEX"
          cp "${BLUEPRINT_TEX%.tex}.pdf" blueprint.pdf

      - name: Upload blueprint.pdf (per-run artifact)
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-pdf
          path: blueprint.pdf
          if-no-files-found: error

  # The dependency-graph view. See the header note for why this needs neither TeX nor a
  # graphviz binary.
  web:
    if: inputs.build_web
    runs-on: ubuntu-latest
    env:
      WEB_DIR: ${{ inputs.blueprint_web_dir }}
      WEB_OUT: ${{ inputs.blueprint_web_out }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `cache: pip` here: it keys the cache on a dependency file and fails the job
      # outright ("No file matched to [**/requirements.txt or **/pyproject.toml]") when the
      # article has neither -- and an article repo has no reason to. The requirements are
      # three small pure-Python packages named in an input, so there is little to cache.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Two system dependencies, both of which fail quietly rather than loudly:
      #
      #   graphviz  - pygraphviz (via plastexdepgraph) is a binding, not an implementation.
      #               It installs happily from a wheel with no Graphviz present and then
      #               yields a graph with no nodes.
      #
      #   kpsewhich - plasTeX resolves EVERY \input through it (TeX.py:kpsewhich). Its
      #               fallback when the binary is absent is `if name in os.listdir(path)`
      #               over TEXINPUTS, an exact filename match that can never resolve a name
      #               containing a directory separator. So without kpsewhich, files beside
      #               the entry point resolve and blueprint/src/parts/* silently do not --
      #               the build then renders a complete-looking site whose every statement
      #               node is missing. texlive-binaries is the small package that carries
      #               it; no TeX *formats* are needed, since nothing here is typeset.
      - name: Install Graphviz and kpsewhich
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends graphviz graphviz-dev texlive-base
          kpsewhich --version | head -1

      - name: Install plasTeX and the blueprint plugins
        run: pip install ${{ inputs.plastex_requirements }}

      # plastex.cfg's [files] directory= is relative to the config, so this must run from
      # WEB_DIR. --imager=none / --vector-imager=none because every formula goes to MathJax:
      # without them plasTeX probes for pdf2svg and dvisvgm and merely warns when both are
      # absent, which would leave a silent dependency on the runner image.
      - name: Build the web blueprint
        run: |
          cd "$WEB_DIR"
          # Fail here, with a sentence, rather than in plasTeX's traceback. A kpsewhich
          # that RUNS but resolves nothing is worse than an absent one: plasTeX only falls
          # back to its TEXINPUTS scan when the call raises, so an installed-but-
          # unconfigured kpsewhich (texlive-binaries without texlive-base's texmf.cnf)
          # turns every lookup into a bare FileNotFoundError.
          if ! kpsewhich web.tex >/dev/null 2>&1; then
            echo "::error::kpsewhich cannot resolve web.tex from $PWD — it is installed but has no search path, so plasTeX will fail to find every input. Is texlive-base present (not just texlive-binaries)?"
            exit 1
          fi
          plastex -c plastex.cfg --imager=none --vector-imager=none web.tex

      # A plasTeX run that produced no graph is a broken deploy, not a warning: the graph is
      # the whole reason this view exists, and an empty one still renders as a page.
      #
      # The node count is taken from the embedded DOT source (plastexdepgraph writes a
      # `digraph` whose nodes carry shape=ellipse / shape=box, laid out in the browser).
      # Counting DOT structure rather than grepping for `kind:name` label spellings keeps
      # this from being coupled to how the plugin happens to name things.
      - name: Validate the web build
        run: |
          for f in "$WEB_OUT/index.html" "$WEB_OUT/dep_graph_document.html"; do
            [ -s "$f" ] || { echo "::error::$f is missing or empty — plasTeX produced no web build"; exit 1; }
          done
          if ! grep -q 'graphvizlib.wasm\|d3-graphviz' "$WEB_OUT/dep_graph_document.html" "$WEB_OUT"/js/* 2>/dev/null; then
            echo "::error::the dependency graph carries no renderer — is plastexdepgraph installed?"; exit 1
          fi
          if ! grep -q 'digraph' "$WEB_OUT/dep_graph_document.html"; then
            echo "::error::no DOT digraph in dep_graph_document.html — plastexdepgraph produced no graph"; exit 1
          fi
          nodes=$(grep -oE 'shape=(ellipse|box)' "$WEB_OUT/dep_graph_document.html" | wc -l)
          if [ "$nodes" -eq 0 ]; then
            echo "::error::the dependency graph has no nodes — the blueprint built empty"
            # Print the evidence rather than making the next person reproduce it: the two
            # known causes (no Graphviz for pygraphviz; kpsewhich absent so \input drops
            # the part files) both land here, and they look identical from the exit code.
            echo "--- digraph source as generated ---"
            sed -n 's/.*\(digraph[^<]*\).*/\1/p' "$WEB_OUT/dep_graph_document.html" | head -c 2000
            echo
            echo "--- statement environments seen in the rendered pages ---"
            grep -ohoE '(Definition|Lemma|Proposition|Theorem|Corollary) [0-9]+\.[0-9]+' "$WEB_OUT"/*.html 2>/dev/null | sort -u | head -20
            echo "--- pages produced ---"
            ls -1 "$WEB_OUT"
            exit 1
          fi
          echo "web blueprint OK: $nodes nodes in the dependency graph"

      - name: Upload the web blueprint (per-run artifact)
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-web
          path: ${{ inputs.blueprint_web_out }}
          if-no-files-found: error

  # Publish the freshly built pair to the orphan `artifacts` branch — never on a dry run.
  # The branch is recreated from scratch each time (a new root commit, force-pushed), so it
  # never accumulates binary history.
  publish:
    needs: [paper, extra_paper, blueprint]
    # `extra_paper` is skipped when the list is empty, and a skipped need must not block the
    # publish — hence != failure rather than == success.
    if: ${{ !cancelled() && !inputs.dry_run && needs.paper.result == 'success' && needs.blueprint.result == 'success' && needs.extra_paper.result != 'failure' && needs.extra_paper.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # `pattern` so the web blueprint is not dragged in: this branch carries the PDFs only
      # (see the header note).
      - name: Download the built PDFs
        uses: actions/download-artifact@v4
        with:
          pattern: "*-pdf"
          path: publish
          merge-multiple: true

      - name: Assemble and force-push the orphan artifacts branch
        working-directory: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTRA_PAPERS: ${{ inputs.extra_papers }}
        run: |
          # one markdown list item per extra paper, from the JSON input (jq is on the runner)
          EXTRA_LINES="$(echo "$EXTRA_PAPERS" | jq -r '.[] | "- [\(.name).pdf](./\(.name).pdf) — \(.title) (built from `\(.tex)`)"')"
          cat > README.md <<EOF
          # CI-built PDFs

          Built from \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA} on $(date -u +%F) by the shared
          \`linkage\` docs workflow.

          - [paper.pdf](./paper.pdf) — built from \`${{ inputs.paper_tex }}\`
          ${EXTRA_LINES}
          - [blueprint.pdf](./blueprint.pdf) — built from \`${{ inputs.blueprint_tex }}\`

          This orphan branch is recreated (single commit, no history) on every docs
          build of \`main\`. Do not commit to it by hand.
          EOF
          git init -q -b artifacts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ./*.pdf
          git commit -q -m "CI-built PDFs from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7} ($(date -u +%F))"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            artifacts

  # Publish the set into this module's channel on the research site. A dry run assembles
  # dist/ and validates it but never publishes. Otherwise a missing secret fails this job
  # loudly while paper/blueprint/publish stay green: an article whose R2 token is not yet in
  # place should still build, and should still say so.
  #
  # Every module uses the same bucket and the same token. There is nothing per-article to
  # create, and nothing to gate afterwards.
  deploy:
    needs: [paper, extra_paper, blueprint, web]
    # `web` is skipped when build_web is false and `extra_paper` when the list is empty, and
    # a skipped need must not block the deploy — hence != failure rather than == success.
    if: ${{ !cancelled() && needs.paper.result == 'success' && needs.blueprint.result == 'success' && needs.web.result != 'failure' && needs.web.result != 'cancelled' && needs.extra_paper.result != 'failure' && needs.extra_paper.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      # Downloaded separately, not merge-multiple over everything: the web build is a tree
      # with its own index.html, which merged flat would collide with the one assembled
      # below.
      - name: Download the built PDFs
        uses: actions/download-artifact@v4
        with:
          pattern: "*-pdf"
          path: dist
          merge-multiple: true

      - name: Download the web blueprint
        if: inputs.build_web
        uses: actions/download-artifact@v4
        with:
          name: blueprint-web
          path: dist/blueprint

      - name: Assemble dist/ (PDFs + web blueprint + index.html)
        env:
          BUILD_WEB: ${{ inputs.build_web }}
          EXTRA_PAPERS: ${{ inputs.extra_papers }}
        run: |
          cd dist
          BUILD_DATE="$(date -u +%F)"
          # noindex on the development head, which is gated and must never be indexed even if
          # a URL escapes; not on a release, which exists to be found. Same rule as the
          # publish step derives the channel by, and derived the same way so the two cannot
          # disagree: the trigger decides, not a caller.
          ROBOTS='<meta name="robots" content="noindex">'
          case "$GITHUB_REF" in refs/tags/*) ROBOTS="" ;; esac
          # The two web-blueprint list items are emitted only when that view was built, so
          # the landing page never advertises a link that 404s.
          WEB_LINKS=""
          if [ "$BUILD_WEB" = "true" ]; then
            WEB_LINKS='<li><a href="blueprint/">blueprint (web)</a> — the same blueprint as hypertext, with the <a href="blueprint/dep_graph_document.html">dependency graph</a>: which statement rests on which, and whether each is a proved target [T] or a cited analytic interface [A].</li>'
          fi
          # one list item per extra paper (a multi-module repository), from the JSON input
          EXTRA_LINKS="$(echo "$EXTRA_PAPERS" | jq -r '.[] | "<li><a href=\"\(.name).pdf\">\(.name).pdf</a> — \(.title) (<code>\(.tex)</code>)</li>"')"
          cat > index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          ${ROBOTS}
          <title>${GITHUB_REPOSITORY##*/} — documents</title>
          <style>body{font-family:system-ui,sans-serif;max-width:36rem;margin:3rem auto;padding:0 1rem;line-height:1.5}footer{margin-top:2rem;color:#666;font-size:.85rem}</style>
          </head>
          <body>
          <h1>${GITHUB_REPOSITORY##*/}</h1>
          <p>CI-built PDFs, latest <code>${GITHUB_REF_NAME}</code>:</p>
          <ul>
          <li><a href="paper.pdf">paper.pdf</a> — the article (<code>${{ inputs.paper_tex }}</code>)</li>
          ${EXTRA_LINKS}
          <li><a href="blueprint.pdf">blueprint.pdf</a> — the blueprint (<code>${{ inputs.blueprint_tex }}</code>)</li>
          ${WEB_LINKS}
          </ul>
          <footer>Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA} on ${BUILD_DATE} UTC by the shared linkage docs workflow.</footer>
          </body>
          </html>
          EOF

      - name: Validate dist/
        env:
          BUILD_WEB: ${{ inputs.build_web }}
          EXTRA_PAPERS: ${{ inputs.extra_papers }}
        run: |
          for f in dist/paper.pdf dist/blueprint.pdf dist/index.html; do
            [ -s "$f" ] || { echo "::error::$f is missing or empty"; exit 1; }
          done
          for f in dist/paper.pdf dist/blueprint.pdf; do
            head -c 5 "$f" | grep -q "%PDF-" || { echo "::error::$f does not start with %PDF- — not a PDF"; exit 1; }
          done
          grep -q 'href="paper.pdf"' dist/index.html || { echo "::error::index.html lacks the paper.pdf link"; exit 1; }
          grep -q 'href="blueprint.pdf"' dist/index.html || { echo "::error::index.html lacks the blueprint.pdf link"; exit 1; }
          # every extra paper must have arrived, be a PDF, and be linked
          for n in $(echo "$EXTRA_PAPERS" | jq -r '.[].name'); do
            [ -s "dist/$n.pdf" ] || { echo "::error::dist/$n.pdf is missing or empty — the extra paper '$n' did not reach dist/"; exit 1; }
            head -c 5 "dist/$n.pdf" | grep -q "%PDF-" || { echo "::error::dist/$n.pdf does not start with %PDF-"; exit 1; }
            grep -q "href=\"$n.pdf\"" dist/index.html || { echo "::error::index.html lacks the $n.pdf link"; exit 1; }
          done
          grep -q "$GITHUB_SHA" dist/index.html || { echo "::error::index.html lacks the build provenance sha"; exit 1; }
          # Every link the landing page offers must resolve, or the site ships a 404 that
          # nobody notices until a reader clicks it.
          if [ "$BUILD_WEB" = "true" ]; then
            for f in dist/blueprint/index.html dist/blueprint/dep_graph_document.html; do
              [ -s "$f" ] || { echo "::error::$f is missing or empty — the web blueprint did not reach dist/"; exit 1; }
            done
            grep -q 'href="blueprint/"' dist/index.html || { echo "::error::index.html lacks the web blueprint link"; exit 1; }
            grep -q 'href="blueprint/dep_graph_document.html"' dist/index.html || { echo "::error::index.html lacks the dependency graph link"; exit 1; }
            [ -s dist/blueprint/js/graphvizlib.wasm ] || { echo "::error::dist/blueprint/js/graphvizlib.wasm missing — the graph would not render in the browser"; exit 1; }
          else
            if grep -q 'href="blueprint/"' dist/index.html; then
              echo "::error::index.html advertises the web blueprint but build_web is false"; exit 1
            fi
            echo "web blueprint skipped (build_web=false)"
          fi
          echo "dist/ validated:"
          ls -l dist

      - name: "Dry run complete — not deploying"
        if: inputs.dry_run
        run: echo "dist/ assembled and validated; the deploy itself is skipped on a dry run."

      - name: Require the R2 secrets
        if: ${{ !inputs.dry_run }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / CLOUDFLARE_ACCOUNT_ID not configured — cannot publish to the research site. Create an R2 *account* API token (Cloudflare dashboard → R2 → API → Manage API tokens → Create Account API token, Object Read & Write, scoped to the '${{ inputs.bucket }}' bucket) and put its two halves in this repository's Actions secrets, alongside CLOUDFLARE_ACCOUNT_ID. Nothing else is needed: there is no Pages project to create and no Access application to remember — the site's router decides what is public, from the hub's manifest."
            exit 1
          fi
          echo "R2 secrets present."

      # Publish into this module's channel. Which channel is decided by the trigger and by
      # nothing else — a tag build writes that release, anything else writes the development
      # head — so an article repository never has to know, or be able to say, whether it is
      # public. That is the hub manifest's business (ADR-0016 §2, §6).
      #
      # The two channels differ in more than their name:
      #
      #   main        the development head. Mirrored with --delete, so a file that leaves the
      #               build leaves the channel. Served ONLY at /drafts/<slug>/, behind Access.
      #   <tag>       one release. Write-once: a DOI names it, and a reader who cites
      #               /papers/<slug>/<version>/ must get the same bytes in five years. The
      #               guard below refuses rather than overwrite, so a re-run of a tag build is
      #               a loud failure and not a silent rewriting of history.
      #
      # `aws` is preinstalled on GitHub's Ubuntu runners; R2 speaks the S3 API, so no AWS
      # account is involved and nothing here reaches AWS.
      - name: Publish dist/ to the research site
        if: ${{ !inputs.dry_run }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ inputs.bucket }}
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          endpoint="https://${ACCOUNT}.r2.cloudflarestorage.com"
          case "$GITHUB_REF" in
            refs/tags/*) channel="${GITHUB_REF#refs/tags/}" ;;
            *)           channel="main" ;;
          esac
          dest="s3://${BUCKET}/${SLUG}/${channel}/"

          if [ "$channel" = "main" ]; then
            aws s3 sync dist/ "$dest" --endpoint-url "$endpoint" --delete --no-progress
            echo "published the development head to /drafts/${SLUG}/ (gated)"
          else
            if aws s3 ls "$dest" --endpoint-url "$endpoint" | grep -q .; then
              echo "::error::${dest} already exists and a release channel is immutable — a DOI names these bytes. To correct a release, cut a new version; to republish deliberately, delete the channel by hand first."
              exit 1
            fi
            aws s3 sync dist/ "$dest" --endpoint-url "$endpoint" --no-progress
            echo "published release ${channel} to /papers/${SLUG}/${channel}/"
            echo "It becomes visible once the hub's manifest names it: site.published.version = ${channel}."
          fi
