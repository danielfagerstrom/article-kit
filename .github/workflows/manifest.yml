name: Manifest projection (reusable)

# The theorem channel's "check" flow (hub ARCHITECTURE.md), as a REUSABLE workflow: an
# article repo calls it, and on every `main` push that can change its blueprint's
# projection it regenerates `blueprint-manifest-<slug>.json` and commits it into the hub
# (`danielfagerstrom/notes-wiki`), where `wiki lint` / `wiki gate` and the eval cache's
# RECHECK-on-\leanok loop read it.
#
# Single-writer is preserved PER SATELLITE, which is why the filename carries the slug.
# Before the split this workflow wrote one fixed `blueprint-manifest.json`; a second
# article calling it would have silently fought the first for that path, breaking exactly
# the invariant the single-writer rule exists to protect.
#
# The generator is stdlib-only and works on source text alone (no lake / Lean toolchain);
# its freshness stamp reads HEAD via `git rev-parse --short HEAD`, so the default shallow
# checkout is fine. The stamp (generated_at / source_commit / source_dirty) changes on
# every run, so a semantic diff-guard compares fresh vs. hub copy EXCLUDING those fields
# and skips the commit when the projected content is unchanged — no noise commits on
# Lean-only refactors or paper pushes.
#
# On pull requests the caller should pass dry_run: true — emit + a self-test of the
# diff-guard semantics, never touching the hub. The cross-repo push needs
# `secrets.NOTES_WIKI_TOKEN` (a fine-grained PAT scoped to notes-wiki with Contents
# read/write — account-side setup in docs/CLOUD.md § "Manifest projection").

on:
  workflow_call:
    inputs:
      slug:
        description: "Satellite id — must match `slug` in the article's linkage.toml."
        required: true
        type: string
      dry_run:
        description: "Emit and self-test only; never write to the hub."
        required: false
        default: false
        type: boolean
      hub_repo:
        description: "The wiki hub repository that receives the projection."
        required: false
        default: danielfagerstrom/notes-wiki
        type: string
      linkage_ref:
        description: "Ref of the linkage framework to install."
        required: false
        default: main
        type: string
      pandoc_version:
        description: >-
          Pinned pandoc. MUST match DEFAULT_PANDOC_PIN in linkage/config.py (and any
          per-article override): rendered_sha determinism depends on the exact version,
          so a drift here silently moves every label's hash at once.
        required: false
        default: "3.10"
        type: string
    secrets:
      NOTES_WIKI_TOKEN:
        required: false
      ARTICLE_KIT_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: manifest-projection-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  project:
    runs-on: ubuntu-latest
    env:
      MANIFEST_NAME: blueprint-manifest-${{ inputs.slug }}.json
    steps:
      - name: Checkout the article
        uses: actions/checkout@v4

      # Version-PINNED pandoc: determinism of rendered_sha depends on the exact version,
      # so install the pinned release, never `apt install pandoc`.
      # Download OUTSIDE the workspace: an untracked deb in the repo root makes the
      # emitter's whole-repo dirty check stamp `source_dirty: true` (found the honest way
      # — the hub's freshness warning fired on the projected manifest).
      - name: Install pinned pandoc
        run: |
          wget -q -O "$RUNNER_TEMP/pandoc.deb" \
            "https://github.com/jgm/pandoc/releases/download/${{ inputs.pandoc_version }}/pandoc-${{ inputs.pandoc_version }}-1-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
          pandoc --version | head -1

      # article-kit may be private, in which case the runner's GITHUB_TOKEN cannot read it
      # (allowing reusable-workflow *calls* is a separate permission from repo read). A
      # fine-grained PAT with Contents:read on article-kit, passed as ARTICLE_KIT_TOKEN,
      # covers that; without one this falls back to an anonymous clone, which is what a
      # public article-kit needs.
      #
      # Clone to $RUNNER_TEMP, never into the workspace: the manifest emitter's
      # `source_dirty` flag is a whole-repo `git status --porcelain`, so an untracked
      # directory inside the article tree would falsely stamp the projection dirty.
      - name: Install the linkage framework
        env:
          KIT_TOKEN: ${{ secrets.ARTICLE_KIT_TOKEN }}
        run: |
          kit="$RUNNER_TEMP/article-kit"
          if [ -n "$KIT_TOKEN" ]; then
            auth="https://x-access-token:${KIT_TOKEN}@github.com/danielfagerstrom/article-kit"
          else
            auth="https://github.com/danielfagerstrom/article-kit"
          fi
          if ! git clone --depth 1 --branch "${{ inputs.linkage_ref }}" "$auth" "$kit" 2>/dev/null; then
            echo "::error::could not clone danielfagerstrom/article-kit@${{ inputs.linkage_ref }}. If it is private, add a fine-grained PAT with Contents:read on article-kit as the ARTICLE_KIT_TOKEN secret on this repo and pass it through in the caller workflow."
            exit 1
          fi
          pipx install "$kit"
          linkage --help > /dev/null
          echo "linkage installed from article-kit@${{ inputs.linkage_ref }}"

      # Emit BEFORE the hub checkout lands in the workspace, and to $RUNNER_TEMP — the
      # emitter's `source_dirty` flag is a whole-repo `git status --porcelain`, and an
      # untracked hub directory (or the manifest itself) inside the article tree would
      # falsely mark the projection dirty. The step also runs the full linkage check: a
      # `main` state whose blueprint/Lean/ledger edges are broken fails here and is never
      # projected. --require-render: a manifest without the rendered transclusion fields
      # (or with any label failing to render) must never reach the hub — CI is its single
      # writer, so a silent degrade here would strand the hub on prose-only entries.
      - name: Emit the manifest (and run the linkage check)
        run: linkage check --require-render --emit-manifest "$RUNNER_TEMP/$MANIFEST_NAME"

      # ---- dry-run half: prove the guard's semantics, touch nothing ----
      - name: "Dry run: self-test the diff-guard semantics"
        if: inputs.dry_run
        run: |
          python3 - "$RUNNER_TEMP/$MANIFEST_NAME" <<'EOF'
          import copy, json, sys
          # source_dirty is deliberately NOT a stamp field: it is a trust signal the hub
          # warns on, so a dirty->clean flip must project (else a once-dirty hub copy
          # keeps the warning alive until the next content change).
          STAMP = {"generated_at", "source_commit"}
          def strip(m): return {k: v for k, v in m.items() if k not in STAMP}
          fresh = json.load(open(sys.argv[1], encoding="utf-8"))
          stamped = copy.deepcopy(fresh)
          stamped["generated_at"] = "1970-01-01T00:00:00Z"
          stamped["source_commit"] = "0000000"
          assert strip(fresh) == strip(stamped), "stamp-only difference must compare equal"
          dirty = copy.deepcopy(fresh)
          dirty["source_dirty"] = not dirty.get("source_dirty", False)
          assert strip(fresh) != strip(dirty), "source_dirty flip must compare unequal"
          mutated = copy.deepcopy(fresh)
          mutated["labels"]["thm:__probe"] = {}
          assert strip(fresh) != strip(mutated), "content difference must compare unequal"
          assert fresh.get("slug"), "manifest must carry its slug — the hub routes on it"
          print(f"diff-guard OK: slug={fresh['slug']}, {len(fresh['labels'])} labels, "
                f"{len(fresh['lean_decls'])} Lean decls, stamp excluded: {sorted(STAMP)}")
          EOF

      # ---- projection half: guarded cross-repo write ----
      - name: Require NOTES_WIKI_TOKEN
        if: ${{ !inputs.dry_run }}
        env:
          NOTES_WIKI_TOKEN: ${{ secrets.NOTES_WIKI_TOKEN }}
        run: |
          if [ -z "$NOTES_WIKI_TOKEN" ]; then
            echo "::error::NOTES_WIKI_TOKEN is not configured. Create a fine-grained PAT scoped to ${{ inputs.hub_repo }} (Contents: read/write) and add it as an Actions secret named NOTES_WIKI_TOKEN — see docs/CLOUD.md § 'Manifest projection'."
            exit 1
          fi

      - name: Checkout the hub
        if: ${{ !inputs.dry_run }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.hub_repo }}
          ref: main
          token: ${{ secrets.NOTES_WIKI_TOKEN }}
          path: hub

      - name: Semantic diff against the hub's copy
        id: diff
        if: ${{ !inputs.dry_run }}
        run: |
          python3 - "$RUNNER_TEMP/$MANIFEST_NAME" "hub/$MANIFEST_NAME" >> "$GITHUB_OUTPUT" <<'EOF'
          import json, sys
          # source_dirty is semantic, not stamp — see the dry-run step's comment
          STAMP = {"generated_at", "source_commit"}
          def strip(m): return {k: v for k, v in m.items() if k not in STAMP}
          fresh = json.load(open(sys.argv[1], encoding="utf-8"))
          try:
              hub = json.load(open(sys.argv[2], encoding="utf-8"))
          except (FileNotFoundError, json.JSONDecodeError):
              hub = None  # missing or unreadable hub copy -> seed it
          changed = hub is None or strip(fresh) != strip(hub)
          print(f"comparing without stamp fields {sorted(STAMP)}: "
                f"{'CHANGED' if changed else 'unchanged'}", file=sys.stderr)
          print(f"changed={str(changed).lower()}")
          EOF

      - name: Commit and push the projection
        if: ${{ !inputs.dry_run && steps.diff.outputs.changed == 'true' }}
        working-directory: hub
        run: |
          cp "$RUNNER_TEMP/$MANIFEST_NAME" "$MANIFEST_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST_NAME"
          git commit -m "$MANIFEST_NAME: project from ${{ inputs.slug }}@${GITHUB_SHA::7}"
          # If a concurrent hub commit raced us, rebase once and retry. Two satellites
          # projecting at once touch different files, so a rebase always resolves.
          git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }

      - name: No content change — skipping commit
        if: ${{ !inputs.dry_run && steps.diff.outputs.changed == 'false' }}
        run: echo "Manifest content identical to the hub's copy (stamp fields excluded); no commit."
