[project]
name = "linkage"
version = "0.1.0"
description = "Blueprint <-> Lean <-> ledger <-> paper linkage checks and the hub manifest, shared by every article repo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
linkage = "linkage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linkage"]

[tool.hatch.build.targets.wheel.force-include]
"scaffold" = "linkage/scaffold_data"
