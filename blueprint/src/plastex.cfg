[general]
renderer=HTML5
copy-theme-extras=yes
plugins=plastexdepgraph plastexshowmore leanblueprint

[document]
toc-depth=3
toc-non-files=True

[files]
directory=../web/
# 1 = one html file per section, not per chapter. The spec has four chapters, and
# chapter 4 carries four long sections (temporal behaviour, bounded memory, covariant
# family, receptive field); at chapter level that one page holds over half the text.
split-level=1

[html5]
localtoc-level=0
extra-css=extra_styles.css
mathjax-dollars=False
